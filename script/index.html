<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Journal Coach — Handler</title>
</head>
<body>
<script>
/**
 * Journal Coach — Agent Skill Handler
 * 
 * Reçoit l'URL d'un Google Doc, en extrait le texte brut via l'API d'export,
 * et retourne le contenu à Gemma pour analyse coaching.
 *
 * Format attendu (data) :
 *   { "doc_url": "https://docs.google.com/document/d/DOCUMENT_ID/edit" }
 *
 * Format retourné :
 *   { "result": "..." }  — succès
 *   { "error": "..." }   — échec avec message lisible
 */
window.ai_edge_gallery_get_result = async function(data) {
  try {
    // 1. Parser les paramètres reçus de Gemma
    const params = JSON.parse(data);
    const docUrl = params.doc_url;

    if (!docUrl || typeof docUrl !== "string") {
      return JSON.stringify({
        error: "Paramètre doc_url manquant ou invalide. Fournis l'URL complète de ton Google Doc."
      });
    }

    // 2. Extraire l'ID du document depuis l'URL
    //    Supporte les formats : /d/ID/edit, /d/ID, /document/d/ID/...
    const match = docUrl.match(/\/d\/([a-zA-Z0-9-_]+)/);
    if (!match) {
      return JSON.stringify({
        error: "URL Google Doc non reconnue. Copie l'URL directement depuis la barre d'adresse de ton navigateur."
      });
    }

    const docId = match[1];

    // 3. Construire l'URL d'export en texte brut
    const exportUrl = `https://docs.google.com/document/d/${docId}/export?format=txt`;

    // 4. Fetch du contenu
    const response = await fetch(exportUrl, {
      method: "GET",
      headers: {
        "Accept": "text/plain"
      }
    });

    if (response.status === 403) {
      return JSON.stringify({
        error: "Accès refusé (403). Active le partage de ton Google Doc : Partager → Toute personne disposant du lien → Lecteur."
      });
    }

    if (response.status === 404) {
      return JSON.stringify({
        error: "Document introuvable (404). Vérifie que l'URL est correcte."
      });
    }

    if (!response.ok) {
      return JSON.stringify({
        error: `Erreur ${response.status} lors de la lecture du document. Réessaie dans quelques instants.`
      });
    }

    const text = await response.text();

    if (!text || text.trim().length === 0) {
      return JSON.stringify({
        error: "Le document est vide ou n'a pas pu être lu. Vérifie qu'il contient du texte."
      });
    }

    // 5. Tronquer si nécessaire pour tenir dans le contexte (128K tokens de Gemma 4 E4B)
    //    50 000 caractères ≈ 12 000–15 000 tokens — amplement suffisant pour un journal
    const MAX_CHARS = 50000;
    const truncated = text.length > MAX_CHARS
      ? text.substring(0, MAX_CHARS) +
        `\n\n[⚠️ Document tronqué — seuls les ${MAX_CHARS.toLocaleString()} premiers caractères ont été chargés sur ${text.length.toLocaleString()} au total.]`
      : text;

    const charCount = text.length;
    const wordCount = text.trim().split(/\s+/).length;

    return JSON.stringify({
      result:
        `📖 Journal chargé avec succès — ${wordCount.toLocaleString()} mots, ${charCount.toLocaleString()} caractères.\n\n` +
        `--- DÉBUT DU JOURNAL ---\n\n${truncated}\n\n--- FIN DU JOURNAL ---`
    });

  } catch (err) {
    // Erreur réseau ou de parsing
    return JSON.stringify({
      error: `Erreur inattendue : ${err.message}. Vérifie ta connexion internet et les permissions du document.`
    });
  }
};
</script>
</body>
</html>
